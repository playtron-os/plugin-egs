[package]
name = "plugin-egs"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.40"
env_logger = "0.11.6"
event-listener = "5.4.0"
lazy_static = "1.5.0"
log = "0.4.26"
num-derive = "0.4.2"
num-traits = "0.2.19"
rand = "0.8"
rsa = {version="0.9.8", features=["sha2"]}
serde = "1.0.218"
serde_json = "1.0.140"
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "2.0.12"
tokio = {version="1.43.0", features=["full"]}
zbus = { version = "5.5.0", default-features = false, features = ["tokio"] }
zbus_macros = "5.5.0"
zbus_names = "4.2.0"
convert_case = "0.8.0"
futures = "0.3.31"
async-stream = "0.3.6"
async-trait = "0.1.87"
nix = { version = "0.29.0", features = [
    "fs",
]}
parking_lot = "0.12.3"
regex = "1.11.1"
