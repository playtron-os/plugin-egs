[package]
name = "plugin-egs"
version = "1.1.4"
edition = "2021"
license = "GPL-2.0"
description = "Epic Games plugin for Playtron GameOS"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/plugin-egs", dest = "/usr/bin/plugin-egs", mode = "755" },
  { source = "./pluginmanifest.json", dest = "/usr/share/playtron/plugins/epic/pluginmanifest.json", mode = "644" },
  { source = "./LICENSE", dest = "/usr/share/plugin-egs/LICENSE", mode = "644", doc = true },
]
auto-req = "no"


[dependencies]
base64 = "0.22.1"
chrono = "0.4.40"
env_logger = "0.11.6"
event-listener = "5.4.0"
lazy_static = "1.5.0"
log = "0.4.26"
num-derive = "0.4.2"
num-traits = "0.2.19"
rand = "0.8"
rsa = {version="0.9.8", features=["sha2"]}
serde = "1.0.218"
serde_json = "1.0.140"
strum = "0.27.1"
strum_macros = "0.27.1"
thiserror = "2.0.12"
tokio = {version="1.43.0", features=["full"]}
zbus = { version = "5.5.0", default-features = false, features = ["tokio"] }
zbus_macros = "5.5.0"
zbus_names = "4.2.0"
convert_case = "0.8.0"
futures = "0.3.31"
async-stream = "0.3.6"
async-trait = "0.1.87"
nix = { version = "0.29.0", features = [
    "fs",
]}
parking_lot = "0.12.3"
regex = "1.11.1"
tokio-util = "0.7.15"
dirs = "6.0.0"
url = "2.5.7"
shlex = "1.3.0"
